name: 약가DB 월간 갱신

on:
  schedule:
    - cron: "0 18 1 * *"   # 매달 2일 03:00 (한국 시간)
  workflow_dispatch: {}      # Actions 탭에서 수동 실행 가능

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 약가DB 새로 만들기
        run: node scripts/update-price-db.mjs
      - name: 바뀐 게 있으면 올리기
        run: |
          if git diff --quiet drugPriceDB.js; then echo "변경 없음"; exit 0; fi
          git config user.name "allai-bot"
          git config user.email "actions@users.noreply.github.com"
          git add drugPriceDB.js
          git commit -m "약가DB 자동 갱신 $(TZ=Asia/Seoul date +%Y-%m-%d)"
          git push
